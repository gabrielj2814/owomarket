name: frontend

# Sin disparador en `moduleProduct` a propósito: el job de Playwright necesita MySQL,
# los seeders y los dominios en /etc/hosts, y eso está sin validar contra un runner real.
# Se activará al abordar el despliegue.
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # Los tests de frontend no corrían en ningún sitio: `tests.yml` sólo ejecuta Pest.
  # Por eso los bugs del 2026-08-21 (el `usePage()` fuera del componente de Inertia y
  # el 419 del login de tienda) llegaron a producción sin que ninguna suite chistara.
  unit:
    name: vitest + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript
        run: npm run types

      - name: Vitest
        run: npm run test:unit

  e2e:
    name: playwright
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: owomarket_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Los subdominios de tienda tienen que resolver: la tenancy se inicializa por
      # dominio, así que sin esto ningún spec de tienda puede siquiera cargar.
      - name: Configure Domains
        run: |
          {
            echo "APP_ENV=local"
            echo "APP_URL=http://owomarket.local:8000"
            echo "APP_CENTRAL_DOMAIN=owomarket.local"
            echo "VITE_APP_CENTRAL_DOMAIN=owomarket.local"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=owomarket_dev"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD="
            echo "CENTRAL_DB_HOST=127.0.0.1"
            echo "CENTRAL_DB_PORT=3306"
            echo "CENTRAL_DB_DATABASE=owomarket_dev"
            echo "CENTRAL_DB_USERNAME=root"
            echo "CENTRAL_DB_PASSWORD="
            echo "USER_PASSWORD_DEV=OwO_12345678"
            echo "DEFAULT_USER_TENANT_OWNER_PASSWORD_DEV=EndAdmin_12345678"
          } >> .env
          sudo tee -a /etc/hosts >/dev/null <<'HOSTS'
          127.0.0.1 owomarket.local
          127.0.0.1 chivostore.owomarket.local
          HOSTS

      - name: Migrate and Seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Build Assets
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # `PHP_CLI_SERVER_WORKERS` es imprescindible: el login de tienda hace una llamada
      # servidor-a-servidor al mismo host, y con un solo worker el servidor se bloquea
      # esperándose a sí mismo. En Linux el servidor embebido de PHP sí respeta la variable.
      - name: Playwright
        run: npx playwright test
        env:
          PHP_CLI_SERVER_WORKERS: 4
          PLAYWRIGHT_BASE_URL: http://owomarket.local:8000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
