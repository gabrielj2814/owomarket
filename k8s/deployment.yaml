# ====================================================
# Kubernetes Manifest Completo para OWOMarket Multi-Tenant
# ====================================================

apiVersion: v1
kind: Namespace
metadata:
  name: owomarket
---
# 1. ConfigMap: Variables de Entorno Públicas
apiVersion: v1
kind: ConfigMap
metadata:
  name: owomarket-config
  namespace: owomarket
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://owomarket.com"
  CENTRAL_DOMAIN: "owomarket.com"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "owomarket"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "redis-service"

---
# 2. Secret: Variables de Entorno Sensibles (Base64)
apiVersion: v1
kind: Secret
metadata:
  name: owomarket-secrets
  namespace: owomarket
type: Opaque
stringData:
  APP_KEY: "base64:COPIAR_AQUI_TU_APP_KEY_GENERADA"
  DB_USERNAME: "owomarket_user"
  DB_PASSWORD: "CAMBIAR_POR_PASSWORD_SEGURO"

---
# 3. Deployment: Pods de la Aplicación (PHP-FPM + Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owomarket-backend
  namespace: owomarket
  labels:
    app: owomarket-backend
spec:
  replicas: 2 # Número de Réplicas/Pods para Alta Disponibilidad
  selector:
    matchLabels:
      app: owomarket-backend
  template:
    metadata:
      labels:
        app: owomarket-backend
    spec:
      containers:
        # Contenedor 1: PHP-FPM (Tu Imagen de Proyecto)
        - name: php-fpm
          image: ghcr.io/tu-usuario/owomarket-backend:v1.0.0 # Reemplazar con tu imagen en Docker Registry
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: owomarket-config
            - secretRef:
                name: owomarket-secrets
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        # Contenedor 2: Nginx (Proxy Ingress Sidecar)
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: owomarket-nginx-config

---
# 4. ConfigMap: Configuración de Nginx para Kubernetes
apiVersion: v1
kind: ConfigMap
metadata:
  name: owomarket-nginx-config
  namespace: owomarket
data:
  default.conf: |
    server {
        listen 80;
        server_name ~^(?<tenant>.+)\.owomarket\.com$ *.owomarket.com owomarket.com;
        root /var/www/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

---
# 5. Service: Balanceador de Carga Interno ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: owomarket-service
  namespace: owomarket
spec:
  type: ClusterIP
  selector:
    app: owomarket-backend
  ports:
    - port: 80
      targetPort: 80
      name: http
